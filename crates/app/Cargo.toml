[package]
name = "inputshare"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Free open-source mouse and keyboard sharing for Windows PCs on a LAN (INTmouse)."

[[bin]]
name = "INTmouse"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
inputshare-protocol = { workspace = true }
inputshare-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = "5"
eframe = { version = "0.29", default-features = true, features = ["default_fonts"] }
egui = "0.29"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = { workspace = true }
hex = { workspace = true }
ureq = { workspace = true }
# IPv6 sockets with IPV6_V6ONLY (net/hub.rs); already in the tree via tokio.
socket2 = "0.6"
serde_json = { workspace = true }
# Native file picker ("Wyślij plik…") and opening the pricing page in the browser.
rfd = "0.15"
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    # COM objects of our own: the drop target / drop source for drag & drop across the edge.
    "implement",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell_Common",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
# `#[implement]` (windows crate) expands to paths in this crate.
windows-core = "0.58"
winrt-notification = "0.5"
