[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/core",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["IntMouse contributors"]
repository = "https://github.com/skullboypl/intmouse"

[workspace.dependencies]
inputshare-protocol = { path = "crates/protocol" }
inputshare-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
bytes = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
bincode = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = true }
